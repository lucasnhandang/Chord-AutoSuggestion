<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Auto-Suggestion Audit Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Initial Import Screen (shown by default) -->
        <div id="importScreen" class="import-screen">
            <h1>Chord Auto-Suggestion Audit Tool</h1>
            <p>Please import JSON file to start!</p>
            <div class="import-controls">
                <button id="initialImportBtn" class="btn btn-large">Import File</button>
                <input type="file" id="jsonFileInput" accept=".json" style="display: none;">
            </div>
        </div>
        
        <!-- Song Selection Screen (shown after import) -->
        <div id="songSelectionScreen" class="song-selection-screen" style="display: none;">
            <h2>Select a song</h2>
            <div id="songList" class="song-list">
                <!-- Songs will be loaded here -->
            </div>
            <div class="selection-controls">
                <button id="backToImportBtn" class="btn">Import another file</button>
                <button id="saveBtn" class="btn">Save file</button>
            </div>
        </div>

        <!-- Player Screen (shown after song selection) -->
        <div id="playerScreen" class="player-screen" style="display: none;">
            <!-- Video Player -->
            <div class="video-container">
                <div id="youtubePlayer"></div>
            </div>
            
            <!-- Player Controls -->
            <div class="player-controls">
                <button id="playPauseBtn" class="control-btn">⏺</button>
                <button id="pauseBtn" class="control-btn">⏸</button>
                <button id="backToSongsBtn" class="control-btn">🔙</button>
                <span id="offsetDisplay" class="offset-display">Offset: Not set</span>
                <button id="resetOffsetBtn" class="control-btn" style="display: none;">⏺️</button>
            </div>

            <!-- Chord Track -->
            <div class="chord-track-container">
                <div id="chordTrack" class="chord-track">
                    <!-- Chords will be displayed here -->
                </div>
            </div>
            
            <!-- Chord Edit Controls (Hidden until chord is selected) -->
            <div id="chordEditControls" class="chord-edit-controls" style="display: none;">
                <button id="deleteChordBtn" class="btn">Delete</button>
                <button id="addChordBtn" class="btn">Add</button>
            </div>
        </div>
    </div>

    <!-- YouTube API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
</html>
